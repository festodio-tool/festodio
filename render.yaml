services:
  - type: web
    name: festodio
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300"
    envVars:
      - key: FESTODIO_PASSWORD
        generateValue: true
      - key: FESTODIO_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
